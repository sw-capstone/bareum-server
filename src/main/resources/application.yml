spring:
  application:
    name: bareum-server
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": ${SMTP_CONNECTION_TIMEOUT_MS:5000}
      "[mail.smtp.timeout]": ${SMTP_READ_TIMEOUT_MS:5000}
      "[mail.smtp.writetimeout]": ${SMTP_WRITE_TIMEOUT_MS:5000}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: false
    out-of-order: false
    clean-disabled: true
  jpa:
    open-in-view: true
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        type:
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper

springdoc:
  api-docs:
    enabled: true
  override-with-generic-response: false
  remove-broken-reference-definitions: false

scalar:
  enabled: true
  url: /v3/api-docs
  path: /scalar
  page-title: Bareum API
  theme: default
  layout: classic

auth:
  login-jwt:
    signing-key: ${LOGIN_JWT_SIGNING_KEY:}
  login:
    access-ttl-seconds: ${LOGIN_ACCESS_TTL_SECONDS:900}
    session-ttl-seconds: ${LOGIN_SESSION_TTL_SECONDS:28800}
    cookie-secure: ${LOGIN_COOKIE_SECURE:true}
    cookie-same-site: ${LOGIN_COOKIE_SAME_SITE:None}
    allowed-origins: ${LOGIN_ALLOWED_ORIGINS:}
    max-requests-per-window: ${LOGIN_MAX_REQUESTS_PER_WINDOW:10}
    request-window-seconds: ${LOGIN_REQUEST_WINDOW_SECONDS:60}
  token-renew:
    max-requests-per-window: ${TOKEN_RENEW_MAX_REQUESTS_PER_WINDOW:30}
    request-window-seconds: ${TOKEN_RENEW_REQUEST_WINDOW_SECONDS:60}
  email-verification:
    hash-secret: ${EMAIL_VERIFICATION_HASH_SECRET}
    mail-from: ${EMAIL_VERIFICATION_MAIL_FROM:}
    outbox:
      encryption-key: ${EMAIL_VERIFICATION_OUTBOX_ENCRYPTION_KEY:}
      key-id: ${EMAIL_VERIFICATION_OUTBOX_KEY_ID:v1}
      enabled: ${EMAIL_VERIFICATION_OUTBOX_ENABLED:true}
