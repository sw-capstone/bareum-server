name: bareum

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 45s
    ports:
      - "${HTTP_BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/www/certbot
        target: /var/www/certbot
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/letsencrypt
        target: /etc/letsencrypt
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  server:
    image: ${SERVER_IMAGE:?}
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 45s
    env_file:
      - path: ${SERVER_ENV_FILE:-./env/.env.server}
        format: raw
    volumes:
      - type: bind
        source: ${RDS_CA_FILE:?}
        target: /etc/ssl/certs/rds-ca.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "2", "--output", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  ai:
    image: ${AI_IMAGE:?}
    restart: unless-stopped
    init: true
    logging: *logging
    stop_grace_period: 45s
    env_file:
      - path: ${AI_ENV_FILE:-./env/.env.ai}
        format: raw
    environment:
      BAREUM_AI_INTERRUPT_PREVIOUS_ON_STARTUP: "true"
      BAREUM_AI_DATABASE_CA_FILE: /etc/ssl/certs/rds-ca.pem
    volumes:
      - type: bind
        source: ${RDS_CA_FILE:?}
        target: /etc/ssl/certs/rds-ca.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "--output", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
