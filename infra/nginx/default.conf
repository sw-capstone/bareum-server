resolver 127.0.0.11 valid=10s ipv6=off;

upstream spring_backend {
    zone spring_backend 64k;
    server server:8080 resolve;
}

upstream ai_backend {
    zone ai_backend 64k;
    server ai:8000 resolve;
}

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";

# 인증 경로는 HTTP로 제공하고, 나머지 외부 요청은 HTTPS로 보낸다.
server {
    listen 80 default_server;
    server_name api.bareum.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://api.bareum.site$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name api.bareum.site;

    ssl_certificate /etc/letsencrypt/live/api.bareum.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bareum.site/privkey.pem;

    location / {
        proxy_pass http://spring_backend;
    }
}

# 컨테이너 안에서만 사용하는 Spring 상태 확인 경로.
server {
    listen 127.0.0.1:8082;
    server_name _;

    location = /health {
        proxy_pass http://spring_backend;
    }
}

# Spring의 AI 호출 주소: http://nginx:8081 (호스트 포트는 공개하지 않는다).
server {
    listen 8081;
    server_name _;

    location / {
        proxy_pass http://ai_backend;
    }
}
