services:
  server:
    build:
      context: .
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/bareum
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME with --env-file .env.local}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD with --env-file .env.local}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy

  ai:
    build:
      context: ../bareum-ai
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bareum
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME with --env-file .env.local}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD with --env-file .env.local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
