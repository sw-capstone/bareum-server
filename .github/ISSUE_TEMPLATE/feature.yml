name: "✨ Feature"
description: "기능을 새로 추가하거나, 기존 기능이 지원하는 동작과 범위를 확장하는 작업에 사용합니다."
title: "[Feat] "
labels: [":sparkles: feature"]

body:
  - type: textarea
    id: description
    attributes:
      label: 어떤 기능인가요?
      description: 추가하거나 확장할 기능과 필요한 이유를 설명해주세요.
      placeholder: |
        e.g. 사용자가 문서 분석 진행 상황을 확인할 수 있도록 작업 상태 조회 API를 추가했으면 좋겠습니다.
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 작업 목록
      description: 필요한 작업을 작성해주세요. 작업이 크면 하위 이슈로 나누어 연결해주세요.
      placeholder: |
        e.g.

        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 이슈, 기획 문서, API 계약, 설계 자료 등을 연결해주세요.
      placeholder: |
        e.g.

        - related to #이슈번호
        - https://...
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 확인사항
      options:
        - label: 동일하거나 유사한 이슈가 없는지 확인했습니다.
          required: true
        - label: 적절한 라벨과 Assignee를 설정했습니다.
          required: true
