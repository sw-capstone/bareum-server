name: "⚙️ Chore"
description: "개발·실행 환경, 인프라, 빌드·배포 자동화, 의존성을 구성하거나 정비하는 작업에 사용합니다."
title: "[Chore] "
labels: [":gear: chore"]

body:
  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 무엇을 변경하나요?
      placeholder: |
        e.g. AI 워커 실행에 사용하는 패키지의 의존성 버전 업데이트
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 작업이 필요한 이유
      description: 작업 배경과 기대 효과를 설명해주세요.
      placeholder: |
        e.g. 기존 버전의 호환성 문제를 해결하고 안정적인 실행 환경을 유지하기 위해 업데이트가 필요합니다.
    validations:
      required: false

  - type: textarea
    id: todo
    attributes:
      label: 작업 목록
      description: 필요한 작업을 체크리스트로 작성해주세요.
      placeholder: |
        e.g.

        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 개발·실행·배포 환경에 미치는 영향을 적어주세요. 관련 문서나 이슈도 연결할 수 있습니다.
      placeholder: |
        e.g. AI 워커 실행 환경 전체, 로컬 의존성 재설치 필요
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 확인사항
      options:
        - label: 동일하거나 유사한 이슈가 없는지 확인했습니다.
          required: true
        - label: 적절한 라벨과 Assignee를 설정했습니다.
          required: true
