name: CI

on:
  pull_request:
    branches: [develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Bareum Server CI
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bareum_ci
          POSTGRES_USER: bareum_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bareum_ci -d bareum_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/bareum_ci
      DB_USERNAME: bareum_ci
      DB_PASSWORD: ci-only-password
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate workflow and shell syntax
        run: bash .github/scripts/check-ci.sh
      - name: Test SSM deployment requests
        run: bash .github/tests/deploy-via-ssm-test.sh
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Test deployment and rollback
        run: bash infra/tests/deploy-test.sh
      - name: Validate and build boot JAR
        run: ./gradlew --no-daemon check bootJar
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build ARM64 image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: bareum-server:pr-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image and Compose routes
        env:
          SMOKE_IMAGE: bareum-server:pr-smoke
        run: bash .github/scripts/smoke-image.sh
