name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      server: ${{ steps.checks.outputs.server }}
      infra: ${{ steps.checks.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks for changed files
        id: checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/select-ci-checks.sh >> "$GITHUB_OUTPUT"

  static:
    name: Workflow and shell checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate workflow and shell syntax
        run: bash .github/scripts/check-ci.sh
      - name: Test CI check selection
        run: bash .github/tests/select-ci-checks-test.sh
      - name: Test CI result aggregation
        run: bash .github/tests/check-ci-results-test.sh

  java:
    name: Java checks
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bareum_ci
          POSTGRES_USER: bareum_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bareum_ci -d bareum_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/bareum_ci
      DB_USERNAME: bareum_ci
      DB_PASSWORD: ci-only-password
      # 테스트 전용 키이며 운영 키를 사용하지 않습니다.
      EMAIL_VERIFICATION_HASH_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Validate and build boot JAR
        run: ./gradlew --no-daemon check bootJar

  image:
    name: ARM64 image checks
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build ARM64 image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: bareum-server:pr-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image and Compose routes
        env:
          SMOKE_IMAGE: bareum-server:pr-smoke
        run: bash .github/scripts/smoke-image.sh

  infra-unit:
    name: Deployment tests (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SSM requests
            script: .github/tests/deploy-via-ssm-test.sh
          - name: Server environment
            script: infra/tests/prepare-server-env-test.sh
          - name: AI environment
            script: infra/tests/prepare-ai-env-test.sh
          - name: Deployment and rollback
            script: infra/tests/deploy-test.sh
          - name: Release preparation
            script: infra/tests/prepare-infra-release-test.sh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run deployment test
        env:
          TEST_SCRIPT: ${{ matrix.script }}
        run: bash "$TEST_SCRIPT"

  infra-integration:
    name: Infrastructure integration (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Compose and Nginx
            script: infra/tests/prepare-infra-release-test.sh
            real_validation: "1"
          - name: Release application and rollback
            script: infra/tests/apply-infra-release-integration-test.sh
            real_validation: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run infrastructure integration test
        env:
          TEST_SCRIPT: ${{ matrix.script }}
          TEST_REAL_VALIDATION: ${{ matrix.real_validation }}
        run: bash "$TEST_SCRIPT"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Test secret detection
        env:
          GITLEAKS_BINARY: gitleaks
          PYTHONPATH: harness/src
        run: python -m unittest discover -s harness/tests -p 'test_secret_scan.py' -v
      - name: Scan Git history
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            ./scripts/run-secret-scan.sh --log-opts="$BASE_SHA..$HEAD_SHA"
          else
            ./scripts/run-secret-scan.sh
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: harness/reports/secret-scan.json
          if-no-files-found: warn

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r harness/requirements.txt
      - run: ./scripts/run-harness.sh check
      - run: ./scripts/test-harness.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: harness/reports/report.json
          if-no-files-found: warn

  validate:
    name: Bareum Server CI
    needs: [changes, static, java, image, infra-unit, infra-integration, harness, secret-scan]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check required CI results
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: bash .github/scripts/check-ci-results.sh
